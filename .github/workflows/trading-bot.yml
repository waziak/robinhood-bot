name: Robinhood Trading Bot

on:
  schedule:
    # 4 sessions/day, ~5.5h each — near-24/7 crypto coverage.
    # The 12:35 UTC session covers US market open (13:30 UTC / 9:30 ET),
    # the 18:35 session covers the close.
    - cron: '35 0 * * *'
    - cron: '35 6 * * *'
    - cron: '35 12 * * *'
    - cron: '35 18 * * *'
  workflow_dispatch:  # manual trigger for testing

concurrency:
  group: trading-bot
  cancel-in-progress: false

permissions:
  contents: write  # needed to commit the updated paper balance back to the repo

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # hard cap under GitHub's 6h wall; bot self-exits at 5.5h

    env:
      RH_USERNAME: ${{ secrets.RH_USERNAME }}
      RH_PASSWORD: ${{ secrets.RH_PASSWORD }}
      PAPER_MODE: ${{ secrets.PAPER_MODE }}
      MAX_SESSION_SECONDS: '19800'  # 5.5h — leaves 20min buffer before timeout kill

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # TimesFM's checkpoint (~800MB) is immutable for a given model id, so a
      # stable key means: download once, hit cache on every run after. Avoids
      # re-pulling 800MB x 4 sessions/day forever. Safe to fail open — forecast.py
      # just disables the forecast signal for the session if the weights aren't
      # there (e.g. this is the very first run before anything's cached).
      - name: Restore TimesFM checkpoint cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/huggingface
          key: hf-timesfm-2.5-200m-pytorch

      # Robinhood no longer offers TOTP 2FA — the only unattended-login option
      # is a device-approval push, which needs a human tap. Every CI run is a
      # fresh machine that looks like a new device, so a cold `rh.login()` would
      # hang on that push every single run. Instead we persist the session
      # (access + refresh token) across runs via cache, keyed so the newest one
      # always wins on restore. See session_auth.py for the resume/refresh logic.
      - name: Restore Robinhood session
        id: restore_session
        uses: actions/cache/restore@v4
        with:
          path: ~/.tokens/robinhood.pickle
          key: rh-session-${{ github.run_id }}
          restore-keys: |
            rh-session-

      # Only needed once, ever — bootstraps the very first session from a
      # one-time manual login (see scripts/bootstrap_session.py). Once the
      # cache above has a real session saved, this secret is never touched again.
      - name: Seed session from secret (first run only)
        if: steps.restore_session.outputs.cache-matched-key == ''
        run: |
          mkdir -p ~/.tokens
          if [ -n "${{ secrets.RH_SESSION_SEED_B64 }}" ]; then
            echo "${{ secrets.RH_SESSION_SEED_B64 }}" | base64 -d > ~/.tokens/robinhood.pickle
            echo "Seeded session from RH_SESSION_SEED_B64"
          else
            echo "No cached session and no RH_SESSION_SEED_B64 secret — this run will need a fresh device-approval login"
          fi

      - name: Run trading bot
        run: python bot.py

      - name: Save TimesFM checkpoint cache
        if: always()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ~/.cache/huggingface
          key: hf-timesfm-2.5-200m-pytorch

      # PAPER_MODE has no broker ledger, so bot.py persists its simulated equity
      # to state.json each session (see state.py). Commit it back so the next
      # scheduled run compounds from real prior equity instead of resetting to
      # config.PORTFOLIO_SIZE every 6 hours.
      - name: Persist paper balance
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json 2>/dev/null)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update paper balance [skip ci]"
            git pull --rebase --autostash origin main
            git push
          else
            echo "No balance change to commit"
          fi

      # Persist whatever session ended up valid (resumed, refreshed, or freshly
      # logged in) so the next scheduled run can skip login entirely.
      - name: Save Robinhood session
        if: always()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ~/.tokens/robinhood.pickle
          key: rh-session-${{ github.run_id }}
