# RETIRED 2026-09-13 — see docs/CREDENTIAL_INCIDENT.md.
#
# This workflow used to run the legacy bot.py on a schedule, authenticating by caching a Robinhood OAuth
# session (access + refresh token) via actions/cache on this PUBLIC repository. That session was exposed for
# ~5 weeks; see the incident doc for the full account and remediation.
#
# The replacement (trader/, see docs/AUTONOMOUS_TRADING_READINESS.md and docs/PHASE_2_READINESS.md)
# authenticates through the local macOS Keychain only (trader/credentials.py) and deliberately does not run
# in CI — an unattended broker session cached anywhere on a public repo is the exact failure mode being
# avoided here. Do not re-add a cron trigger or any broker-credential caching to this workflow.
#
# This file is kept only to run the test suite on push, with no broker access at all.
name: Tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt && pip install pytest==8.3.3
      - run: python -m pytest tests -q
